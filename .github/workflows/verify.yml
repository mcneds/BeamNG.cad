name: Verify

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  add-in:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Build add-in
        run: dotnet build beamng.cad.slnx -c Debug -p:XCadRegDll=false -p:BeamNGPushOnBuild=false -p:OutputPath=bin/ci/
      - name: Check workspace and frame controls
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & powershell.exe -NoProfile -STA -ExecutionPolicy Bypass -File tools/Test-ProjectWorkspace.ps1 -OutputDirectory beamng.cad/bin/ci
          if ($LASTEXITCODE -ne 0) { throw 'Workspace checks failed.' }
          & powershell.exe -NoProfile -STA -ExecutionPolicy Bypass -File tools/Test-FrameDocumentContext.ps1 -OutputDirectory beamng.cad/bin/ci
          if ($LASTEXITCODE -ne 0) { throw 'Frame workflow checks failed.' }

  python:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: 'dependencies/cad-calibration/Test Harness:dependencies/cad-calibration/Vehicle Wizard'
      MPLBACKEND: Agg
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python -m pip install numpy scipy matplotlib pillow
      - run: python tools/run-python-tests.py tests

  handbook:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build
