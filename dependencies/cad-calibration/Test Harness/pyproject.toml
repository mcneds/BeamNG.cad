[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "beamng-frame-harness"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "matplotlib>=3.8", "scipy>=1.15"]

[project.scripts]
frame-harness = "frame_harness.cli:main"

[tool.setuptools.package-data]
frame_harness = ["lua/*.lua", "replay.html"]

[tool.setuptools.packages.find]
include = ["frame_harness*"]
