[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "beamng-vehicle-wizard"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "scipy>=1.15", "PySide6>=6.10", "vtk>=9.7"]

[project.scripts]
vehicle-wizard = "vehicle_wizard.cli:main"

[tool.setuptools.packages.find]
include = ["vehicle_wizard*"]

[tool.setuptools.package-data]
vehicle_wizard = ["*.json"]
